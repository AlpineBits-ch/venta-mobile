dependency_overrides:
  # Vendored copy of flutter_callkit_incoming 3.1.3, previously only patched
  # ad-hoc in the local pub cache (untracked, lost on any `flutter pub
  # cache repair` or fresh checkout — see packages/flutter_callkit_incoming
  # for the actual native fixes). Path override keeps pubspec.yaml's normal
  # version constraint as documentation of which upstream release this forked
  # from.
  flutter_callkit_incoming:
    path: packages/flutter_callkit_incoming
