name: Release

# Cut a release by pushing a tag like `v1.0.1`. `workflow_dispatch` is a
# manual escape hatch for testing the pipeline itself without cutting a
# real tag — the TestFlight/GitHub Release steps only run on tag pushes
# (see the `if:` guards below), so a manual run just builds artifacts.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.8"

jobs:
  android:
    name: Android (release APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - run: flutter pub get

      # No dedicated release keystore yet — this is signed with the debug
      # key, same as local `flutter run --release`. Fine for a sideloaded
      # APK; switch `android/app/build.gradle.kts`'s release signingConfig
      # (and add the matching secrets here) before ever publishing to Play
      # Store, since Play Store requires a stable signing key across updates.
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: venta-mobile-android
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: iOS (TestFlight)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - run: flutter pub get

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios

      - name: Import signing certificate & provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/dist_certificate.p12"
          PP_PATH="$RUNNER_TEMP/dist_profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          # Temporary keychain, scoped to this CI run only.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Apple's intermediate CAs — without these, `security find-identity
          # -v` can't build a full trust chain for the imported cert and
          # silently filters it out of the "valid" list, which is what
          # produces Flutter's "No valid code signing certificates were
          # found" even though the .p12 itself imported fine. Importing a
          # few generations covers whichever one the cert actually chains to.
          for WWDR in AppleWWDRCAG3 AppleWWDRCAG4 AppleWWDRCAG5 AppleWWDRCAG6; do
            curl -fsSL "https://www.apple.com/certificateauthority/${WWDR}.cer" -o "$RUNNER_TEMP/${WWDR}.cer"
            security import "$RUNNER_TEMP/${WWDR}.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security
          done

          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          echo "Valid codesigning identities in the CI keychain:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true

          # Read the profile's own name/UUID instead of hardcoding them, so
          # this doesn't break if the profile gets renamed/regenerated later.
          PROFILE_PLIST=$(security cms -D -i "$PP_PATH")
          PROFILE_UUID=$(echo "$PROFILE_PLIST" | plutil -extract UUID raw -o - -)
          PROFILE_NAME=$(echo "$PROFILE_PLIST" | plutil -extract Name raw -o - -)

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision

          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Generate ExportOptions.plist
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > ios/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>gg.venta.mobile</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          PLIST

      # The archive step (`flutter build ipa` runs `xcodebuild archive`
      # before it ever looks at ExportOptions.plist) reads signing settings
      # straight from the Xcode project, not from ExportOptions.plist —
      # that file only governs the later export step. Without this, Xcode
      # tries to negotiate automatic signing (needs a logged-in Apple ID)
      # and ignores the identity that's actually sitting in the CI
      # keychain, which is what "No valid code signing certificates were
      # found" actually means here.
      - name: Configure Xcode manual signing
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python3 - <<'PY'
          import os
          path = "ios/Runner.xcodeproj/project.pbxproj"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()
          content = content.replace("CI_DEVELOPMENT_TEAM_PLACEHOLDER", os.environ["APPLE_TEAM_ID"])
          content = content.replace("CI_PROVISIONING_PROFILE_PLACEHOLDER", os.environ["PROFILE_NAME"])
          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          PY

      # `flutter build ipa` generates `ios/Podfile` (if missing, as it
      # currently is — iOS has never been built on this Windows dev
      # machine) and runs `pod install` itself as part of the archive step,
      # so no separate CocoaPods step is needed here.
      - name: flutter build ipa
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - uses: actions/upload-artifact@v4
        with:
          name: venta-mobile-ios
          path: build/ios/ipa/*.ipa

      - name: Upload to TestFlight
        if: startsWith(github.ref, 'refs/tags/')
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo -n "${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}" | base64 --decode -o "$KEY_PATH"
          IPA_PATH=$(ls build/ios/ipa/*.ipa | head -n 1)

          cd ios
          APP_STORE_CONNECT_API_KEY_PATH="$KEY_PATH" IPA_PATH="../$IPA_PATH" bundle exec fastlane beta
