name: Release

# Cut a release by pushing a tag like `v1.0.1`. `workflow_dispatch` is a
# manual escape hatch for testing the pipeline itself without cutting a
# real tag - the TestFlight/GitHub Release steps only run on tag pushes
# (see the `if:` guards below), so a manual run just builds artifacts.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.8"

jobs:
  android:
    name: Android (release APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - run: flutter pub get

      # No dedicated release keystore yet - this is signed with the debug
      # key, same as local `flutter run --release`. Fine for a sideloaded
      # APK; switch `android/app/build.gradle.kts`'s release signingConfig
      # (and add the matching secrets here) before ever publishing to Play
      # Store, since Play Store requires a stable signing key across updates.
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: venta-mobile-android
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: iOS (TestFlight)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - run: flutter pub get

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios

      - name: Import signing certificate & provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          # The NotificationService extension is a second binary in the bundle
          # with its own bundle id, and an archive needs one profile per bundle
          # id. Optional so this workflow keeps working on any commit where the
          # extension target is not in project.pbxproj - unset simply skips it.
          EXT_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_EXT_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/dist_certificate.p12"
          PP_PATH="$RUNNER_TEMP/dist_profile.mobileprovision"
          EXT_PP_PATH="$RUNNER_TEMP/dist_ext_profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          # Temporary keychain, scoped to this CI run only.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Apple's intermediate CAs - without these, `security find-identity
          # -v` can't build a full trust chain for the imported cert and
          # silently filters it out of the "valid" list, which is what
          # produces Flutter's "No valid code signing certificates were
          # found" even though the .p12 itself imported fine. Importing a
          # few generations covers whichever one the cert actually chains to.
          for WWDR in AppleWWDRCAG3 AppleWWDRCAG4 AppleWWDRCAG5 AppleWWDRCAG6; do
            curl -fsSL "https://www.apple.com/certificateauthority/${WWDR}.cer" -o "$RUNNER_TEMP/${WWDR}.cer"
            security import "$RUNNER_TEMP/${WWDR}.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security
          done

          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          echo "Valid codesigning identities in the CI keychain:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          # Read each profile's own name/UUID instead of hardcoding them, so this
          # doesn't break if a profile gets renamed or regenerated later. Exports
          # the name under $2 for the ExportOptions.plist step below.
          install_profile() {
            local path="$1" var="$2" plist uuid name
            plist=$(security cms -D -i "$path")
            uuid=$(echo "$plist" | plutil -extract UUID raw -o - -)
            name=$(echo "$plist" | plutil -extract Name raw -o - -)
            cp "$path" ~/Library/MobileDevice/Provisioning\ Profiles/"$uuid".mobileprovision
            echo "$var=$name" >> "$GITHUB_ENV"
            echo "Installed profile '$name' ($uuid)"
            LAST_PROFILE_NAME="$name"
          }

          # Signing is manual, so each target names its profile in project.pbxproj
          # by literal string. A profile whose name doesn't match fails half a
          # minute into the archive, with a message that never mentions either
          # name ("requires a provisioning profile with the ... feature"), so the
          # comparison is worth doing up front.
          check_specifier() {
            if grep -qF "\"PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]\" = \"$1\";" ios/Runner.xcodeproj/project.pbxproj; then
              return 0
            fi
            echo "::error::Installed profile is named '$1', but no target in project.pbxproj asks for it. Targets want:"
            grep -n 'PROVISIONING_PROFILE_SPECIFIER\[sdk' ios/Runner.xcodeproj/project.pbxproj || true
            exit 1
          }

          install_profile "$PP_PATH" PROFILE_NAME
          check_specifier "$LAST_PROFILE_NAME"

          # The extension is a second binary with its own bundle id, so the
          # archive needs a second profile. Tie the requirement to whether the
          # target actually exists rather than treating the secret as optional:
          # unset-but-needed otherwise surfaces 40s into the archive as "No
          # profile for team '***' matching ...", which says nothing about a
          # missing secret.
          if grep -q "gg.venta.mobile.NotificationService" ios/Runner.xcodeproj/project.pbxproj; then
            if [ -z "${EXT_PROVISION_PROFILE_BASE64:-}" ]; then
              echo "::error::project.pbxproj builds the NotificationService extension, but the IOS_EXT_PROVISION_PROFILE_BASE64 secret is unset. Generate an App Store profile for gg.venta.mobile.NotificationService and add it - see docs/push-decryption.md."
              exit 1
            fi
            echo -n "$EXT_PROVISION_PROFILE_BASE64" | base64 --decode -o "$EXT_PP_PATH"
            install_profile "$EXT_PP_PATH" EXT_PROFILE_NAME
            check_specifier "$LAST_PROFILE_NAME"
          else
            echo "No NotificationService target in project.pbxproj - skipping the extension profile."
          fi

      - name: Generate ExportOptions.plist
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          # Every bundle id in the archive needs an entry here, or the export
          # fails with "no profile for ...". The extension's line only appears
          # once its profile was installed above.
          EXT_ENTRY=""
          if [ -n "${EXT_PROFILE_NAME:-}" ]; then
            EXT_ENTRY=$(printf '    <key>gg.venta.mobile.NotificationService</key>\n    <string>%s</string>' "$EXT_PROFILE_NAME")
          fi

          cat > ios/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>gg.venta.mobile</key>
              <string>${PROFILE_NAME}</string>
          ${EXT_ENTRY}
            </dict>
          </dict>
          </plist>
          PLIST

          echo "--- ExportOptions.plist ---"
          cat ios/ExportOptions.plist
          plutil -lint ios/ExportOptions.plist

      # NOTE: signing for both targets lives in project.pbxproj, written by
      # Xcode on a Mac: `CODE_SIGN_STYLE = Manual`, team S33LPKH83B, and a
      # `PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]` naming the profile
      # this job installs above. The steps above are therefore sufficient on
      # their own - nothing patches the project file in CI.
      #
      # Structural changes here (adding a target, a build phase, a file) go
      # through Xcode. An early attempt to write them blind from a non-Mac
      # machine produced a file xcodebuild refused to parse twice over.
      # Changing the *value* of an existing build setting is safe enough by
      # hand; adding objects and their references is not.

      # `flutter build ipa` runs `pod install` itself as part of the archive
      # step, so no separate CocoaPods step is needed here.
      - name: flutter build ipa
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - uses: actions/upload-artifact@v4
        with:
          name: venta-mobile-ios
          path: build/ios/ipa/*.ipa

      - name: Upload to TestFlight
        if: startsWith(github.ref, 'refs/tags/')
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo -n "${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}" | base64 --decode -o "$KEY_PATH"
          IPA_PATH=$(ls build/ios/ipa/*.ipa | head -n 1)

          cd ios
          APP_STORE_CONNECT_API_KEY_PATH="$KEY_PATH" IPA_PATH="../$IPA_PATH" bundle exec fastlane beta
